[package]
name = "tpt-proof-runtime"
description = "Layer 4 of tpt-proof: runtime verification (debug-build assertions)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Property-based testing with proptest (phase 5). Off by default, so the runtime
# crate has no dependencies unless a user asks for them.
proptest = ["dep:proptest"]

[dependencies]
proptest = { version = "1.6", optional = true }
