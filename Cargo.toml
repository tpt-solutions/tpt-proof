[workspace]
resolver = "2"
exclude = ["crates/tpt-proof-mir", "examples/filesystem"]
members = [
    "crates/tpt-proof-kernel",
    "crates/tpt-proof-core",
    "crates/tpt-proof-contract",
    "crates/tpt-proof",
    "crates/tpt-proof-runtime",
    "crates/tpt-proof-macros",
    "crates/tpt-proof-cli",
    "crates/tpt-proof-export",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tpt_proof_verify)"] }
missing_docs = "warn"
