# cargo-deny configuration. Run with: cargo deny check
# Licenses: the core framework is MIT OR Apache-2.0, so dependencies must be
# permissively licensed and compatible with that. GPL and other copyleft
# licenses are rejected.

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.8

allow = ["MIT", "Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
